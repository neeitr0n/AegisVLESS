<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AegisVLESS Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    padding:40px;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    background:linear-gradient(45deg,#0f0c29,#302b63,#24243e);
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

body::before{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    background-image:
        radial-gradient(white,rgba(255,255,255,.2) 2px,transparent 40px),
        radial-gradient(white,rgba(255,255,255,.15) 1px,transparent 30px),
        radial-gradient(white,rgba(255,255,255,.1) 2px,transparent 40px);
    background-size:550px 550px,350px 350px,250px 250px;
    background-position:0 0,40px 60px,130px 270px;
    animation:particles 30s linear infinite;
    z-index:-2;
}

@keyframes particles{
    0%{
        background-position:0 0,0 0,0 0;
    }
    100%{
        background-position:
            550px 550px,
            350px 350px,
            250px 250px;
    }
}

body::after{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    background:
        linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,0.1) 50%),
        linear-gradient(90deg,rgba(0,0,0,0) 50%,rgba(0,0,0,0.1) 50%);
    background-size:20px 20px;
    opacity:.3;
    z-index:-1;
}

.login-container{
    width:100%;
    max-width:440px;
    padding:36px;
    border-radius:30px;
    background:rgba(15,23,42,.72);
    backdrop-filter:blur(18px);
    border:1px solid rgba(100,100,255,.2);
    box-shadow:
        0 10px 45px rgba(0,0,0,.45),
        0 0 30px rgba(100,100,255,.2);
    transition:.3s ease;
    position:relative;
    overflow:hidden;
    animation:fadeIn .6s ease;
}

.login-container::before,
.login-container::after{
    content:'';
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(100,100,255,.3);
    z-index:-1;
}

.login-container::before{
    top:20px;
    right:20px;
    animation:float 6s ease-in-out infinite;
}

.login-container::after{
    bottom:20px;
    left:20px;
    animation:float 8s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translate(0,0);
    }
    25%{
        transform:translate(10px,15px);
    }
    50%{
        transform:translate(0,20px);
    }
    75%{
        transform:translate(-15px,10px);
    }
}

.login-container:hover{
    transform:translateY(-5px) rotateX(2deg);
    box-shadow:
        0 15px 50px rgba(0,0,0,.5),
        0 0 40px rgba(100,100,255,.3);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo-wrapper{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.aegis-logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:64px;
    height:64px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border-radius:18px;
    box-shadow:0 0 20px rgba(139,92,246,.7);
    animation:pulse 2s infinite;
}

.aegis-icon{
    width:34px;
    height:34px;
    stroke:white;
    stroke-width:1.5;
    fill:none;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 15px rgba(139,92,246,.7);
    }
    50%{
        box-shadow:0 0 25px rgba(139,92,246,.9);
    }
    100%{
        box-shadow:0 0 15px rgba(139,92,246,.7);
    }
}

.title{
    text-align:center;
    font-size:34px;
    font-weight:700;
    letter-spacing:-1px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    font-size:14px;
    opacity:.65;
    margin-bottom:32px;
}

.form-group{
    margin-bottom:22px;
}

.form-label{
    display:block;
    margin-bottom:10px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.8px;
    text-transform:uppercase;
    opacity:.65;
}

.form-input{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    color:white;
    font-size:14px;
    transition:.3s ease;
    border:1px solid transparent;
    font-family:"SFMono-Regular",Consolas,monospace;
}

.form-input:focus{
    border:1px solid rgba(100,100,255,.5);
    box-shadow:0 0 15px rgba(100,100,255,.25);
}

.form-input::placeholder{
    color:rgba(255,255,255,.35);
}

.login-btn{
    width:100%;
    position:relative;
    overflow:hidden;
    border:none;
    border-radius:18px;
    padding:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:
        background .5s ease,
        box-shadow .5s ease,
        transform .15s ease;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    box-shadow:
        0 4px 18px rgba(99,102,241,.35),
        0 0 15px rgba(139,92,246,.2);
    animation:glow 3s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:
            0 4px 18px rgba(99,102,241,.35),
            0 0 10px rgba(139,92,246,.1);
    }
    to{
        box-shadow:
            0 4px 18px rgba(99,102,241,.5),
            0 0 20px rgba(139,92,246,.3);
    }
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 6px 22px rgba(99,102,241,.45),
        0 0 25px rgba(139,92,246,.4);
}

.login-btn:active{
    transform:scale(.97);
}

.error-message{
    margin-top:18px;
    padding:14px;
    border-radius:16px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.25);
    color:#fca5a5;
    text-align:center;
    display:none;
    animation:shake .25s ease;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    50%{transform:translateX(4px);}
    75%{transform:translateX(-4px);}
    100%{transform:translateX(0);}
}

.footer{
    margin-top:28px;
    text-align:center;
    font-size:13px;
    opacity:.55;
}

@media(max-width:600px){

    body{
        padding:20px;
    }

    .login-container{
        padding:28px;
        border-radius:24px;
    }

    .title{
        font-size:28px;
    }
}

</style>
</head>

<body>
<div class="login-container">
    <div class="logo-wrapper">
        <div class="aegis-logo">
            <svg class="aegis-icon" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>
    </div>
    <h1 class="title">AegisVLESS</h1>
    <div class="subtitle">
        Secure WebUI Authentication
    </div>
    <form id="login-form">
        <div class="form-group">
            <label class="form-label">
                Username
            </label>
            <input
                type="text"
                id="login"
                class="form-input"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>
        <div class="form-group">
            <label class="form-label">
                Password
            </label>
            <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
        </div>
        <button type="submit" class="login-btn">
            Login
        </button>
        <div class="error-message" id="error-message">
            Invalid username or password
        </div>
    </form>
    <div class="footer">
        AegisVLESS · Access Gateway
    </div>
</div>

<script>

document.getElementById('login-form').addEventListener('submit',async(event)=>{

    event.preventDefault();

    const login=document.getElementById('login').value.trim();
    const password=document.getElementById('password').value.trim();
    const errorMessage=document.getElementById('error-message');
    errorMessage.style.display='none';

    try{

        const response=await fetch('/login',{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                username:login,
                password:password
            })
        });

        const data=await response.json();

        if(data.success){
            window.location.href='/panel';

        }else{

            errorMessage.style.display='block';
            document.getElementById('password').value='';
            document.getElementById('password').focus();
        }

    }catch(error){

        errorMessage.style.display='block';
        console.error(error);
    }

});

</script>

</body>
</html>
